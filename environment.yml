name: opfi
channels:
  - conda-forge
  - bioconda
  - defaults
dependencies:
  # Python
  - python>=3.12
  # Python packages
  - pandas>=2.2
  - biopython>=1.84
  - pysam>=0.23
  # CLI bioinformatics tools
  - minimap2>=2.28
  - samtools>=1.17
  - mafft>=7.505
  - exonerate>=2.4
  - kingfisher>=0.4.1
  # NCBI datasets CLI
  - ncbi-datasets-cli>=18.0
  # tldr installed via pip (not on conda)
  - pip
  - pip:
    - git+https://github.com/adamewing/tldr.git
